# pytest 설정은 pytest.ini가 기준이므로 여기에는 ruff 설정만 둔다.
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["B008"]  # FastAPI Depends()/Query() 기본값 패턴 허용

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
