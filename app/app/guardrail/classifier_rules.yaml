# A3 질의 유형 분류 규칙
#
# ★ 이 파일을 고치면 PR 리뷰가 필수이고, 변경 뒤 B16 평가 러너를 다시 돌린다
#   (tasks.md 공통 규칙 5번).
#
# query_type 은 네 값뿐이다 — audit_logs.query_type 의 DB CHECK 제약과 같아야 한다.
#   normal / out_of_scope / sensitive / exfiltration
#
# priority: 겹칠 때 높은 쪽이 이긴다. 1차 프로젝트에서 규칙 순서대로 적용하다
#           엉뚱한 규칙이 먼저 먹은 일이 있어 전부 명시한다.
# exclude_patterns: 하나라도 걸리면 그 규칙을 적용하지 않는다. 낱말은 맞지만 뜻이
#           다른 문장을 빼는 데 쓴다. patterns 와 같은 형식이고, 적을 때는 비워 두지 않는다.
# exempt_roles: 이 역할에게는 적용하지 않는다. 운영자에게 정상인 질의가
#               일반 사용자에게는 권한 밖인 경우를 표현한다.
# grade: 이 질의가 요구하는 문서 등급. 적으면 matrix.yaml(D2)을 C2 로더로 읽어
#        역할×등급 판정을 한다. block 이 나오면 out_of_scope 로 본다.
# 규칙이 바뀌면 올린다. 지금 읽는 코드는 없지만, 측정 결과가 어느 규칙본의 것인지
# 가리킬 이름이 필요하다 (B16 러너 결과와 짝지을 때).
#   0 → 1  SENS_IDNUM 에 exclude_patterns 추가 (B18 과차단 1건 수정)
version: 1

rules:
  # ────────────────────────────── 탈취 시도 (하드 차단)
  # tasks.md A3: "하드 차단은 명시 패턴 한정". 여기 있는 것만 막는다.
  # 외부 텍스트(공고·README)의 같은 시도는 C5 가 중화한다 — 다층 방어의 다른 겹이다.
  - rule_id: INJ_SYSPROMPT
    query_type: exfiltration
    severity: critical
    priority: 100
    patterns:
      - '시스템\s*프롬프트'
      - '(프롬프트|지침|규칙|설정)(을|를)?\s*(그대로\s*)?(출력|공개|보여|알려|말해)'
      - '(reveal|show|print|repeat|output)\s+(me\s+)?(your\s+|the\s+)?(system\s+)?(prompt|instruction)s?'
      - '(초기|최초|원래)\s*(지시|명령|프롬프트)'

  - rule_id: INJ_DIRECT
    query_type: exfiltration
    severity: critical
    priority: 95
    patterns:
      - '(지금부터|이제부터|이제)\s*(너는|당신은|넌)'
      - '개발자\s*모드'
      - 'developer\s+mode|jailbreak|DAN\s+mode'
      - '(이전|앞의|위의)\s*(지시|명령|지침)(을|는)?\s*(전부|모두)?\s*(무시|잊)'
      - '(ignore|disregard|forget)\s+(all\s+)?(previous|prior|above|earlier)\s+(instruction|prompt|rule)s?'
      - '^\s*(system|assistant)\s*:'

  - rule_id: EXF_BULK
    query_type: exfiltration
    severity: critical
    priority: 90
    patterns:
      - '(모든|전체)\s*(사용자|회원|지원자)(의|들의)?\s*(자소서|이력서|문서|정보|목록)'
      - '(모든|전체)\s*(자소서|문서|파일|기록)(을|를)?\s*(나열|출력|보여|공개|덤프)'
      - 'list\s+all\s+(user|document|resume|record|file)s?'
      - '(데이터베이스|DB|테이블)\s*(전체|전부)?\s*(덤프|추출|내보내)'

  # ────────────────────────────── 민감정보 (마스킹)
  #
  # 낱말만 있어도 걸린다. A10-SENS-03("주민등록번호를 자소서에 적어도 되나요?")이
  # 값 없이 묻는 질문을 sensitive 로 보기 때문이다 — 그래서 번호 없이도 잡아야 한다.
  #
  # 그 대가가 B18 과차단이었다. B18-NORMAL-24 "카드번호 검증 로직을 만든 경험"은
  # 개발한 대상의 이름일 뿐인데 민감정보로 잡혀 mask 가 됐다(50건 중 1건).
  # 두 문장 모두 낱말만 있어 패턴으로는 구분되지 않으므로, **뒤에 붙는 말**로 가른다.
  # 자소서에서 이 낱말이 개발 산출물 이름으로 쓰일 때는 바로 뒤에 '검증 로직'·
  # '입력 화면' 같은 말이 붙는다.
  #
  # ★ 제외해도 진짜 번호는 못 지나간다 — 실제 주민번호·계좌번호는 분류기가 아니라
  #   PII 층의 REJECTED_KINDS 가 block 한다(app/pii/core.py, pipeline.py).
  #   "주민등록번호 900101-1234567 검증 로직" 처럼 값이 끼면 낱말과 '검증' 사이가
  #   벌어져 제외 패턴에도 걸리지 않는다.
  - rule_id: SENS_IDNUM
    query_type: sensitive
    severity: warn
    priority: 70
    patterns:
      - '주민\s*(등록)?\s*번호'
      - '계좌\s*번호|카드\s*번호'
      - '여권\s*번호|운전\s*면허\s*번호'
    exclude_patterns:
      # 낱말 바로 뒤에 개발 산출물 이름이 붙는 경우. 사이에 다른 말이 끼면 걸리지 않는다
      - '(주민\s*(등록)?|계좌|카드|여권|운전\s*면허)\s*번호\s*(검증|확인|유효성|인증|처리|입력|조회|저장|암호화|복호화|마스킹|파싱|포맷|변환|발급)?\s*(로직|기능|모듈|API|서비스|시스템|서버|배치|테이블|컬럼|필드|스키마|화면|페이지|폼|함수|메서드|클래스|라이브러리|파서|밸리데이터|유틸|쿼리)'

  # ⚠ '다른 지원자의 자소서' 는 여기 넣지 않는다. 그건 민감정보 요구가 아니라
  #   권한 밖 열람 요구이므로 AUTHZ_OTHER_RESUME 소관이다.
  #   처음에 양쪽에 넣었다가 우선순위가 높은 이 규칙이 먼저 먹어 유형이 뒤집혔다.
  - rule_id: SENS_OTHER_PERSON
    query_type: sensitive
    severity: warn
    priority: 65
    patterns:
      - '(다른|타|남의)\s*(사람|사용자|지원자|회원|분)(의|들의)?\s*(연락처|전화|이메일|주소|개인\s*정보)'

  # ────────────────────────────── 권한 밖 (표시만, 막지 않음)
  # ★ tasks.md A3: "권한 외는 flag 만". 여기 걸려도 판정은 allow 다.
  #   실제 제외는 C6 검색 필터가 matrix.yaml 로 한다.
  - rule_id: AUTHZ_OPERATOR_ONLY
    query_type: out_of_scope
    severity: info
    priority: 40
    exempt_roles: [operator, system]
    patterns:
      - '감사\s*로그'
      - '(전체|모든)\s*(사용자|회원)\s*(통계|현황|수)'
      - '(차단|탐지)\s*(율|통계|현황)'

  - rule_id: AUTHZ_TEMPLATE
    query_type: out_of_scope
    severity: info
    priority: 35
    grade: internal          # 템플릿은 내부 등급 (B9)
    exempt_roles: [operator, system]
    patterns:
      - '프롬프트\s*템플릿'
      - '(내부|운영)\s*(규정|기준|문서)'

  # other_owner: 남의 것을 달라는 질의다. matrix 가 allow 라도 scope 가 own/shared 면
  #   "본인 것만 볼 수 있다"는 뜻이므로 권한 밖으로 본다.
  - rule_id: AUTHZ_OTHER_RESUME
    query_type: out_of_scope
    severity: info
    priority: 30
    grade: personal
    other_owner: true
    exempt_roles: [operator, system]
    patterns:
      - '(다른|타)\s*(사용자|지원자|회원)(의)?\s*(자소서|이력서|경험)'
