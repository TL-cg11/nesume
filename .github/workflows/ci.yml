# D11 CI. PR 마다 lint·test·security 가 돈다. main 푸시면 build-deploy 가 arm64 이미지를 ECR 에 올리고,
# dev 클러스터가 켜져 있으면 helm 으로 배포한다(꺼져 있으면 skip, 실패 아님).
# Actions 분 절약: test 는 app/web/compose 변경이 있을 때만 돈다(changes job).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: "1.16.x"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter 가 PR 변경 파일 목록을 API 로 읽는다
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'web/**'
              - 'eval/**'
              - 'init/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ruff: 처음엔 D 소유 경로만. 다른 팀 경로는 각자 맞춘 뒤 여기에 추가한다.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.17.0
      - name: ruff (D paths)
        run: >
          ruff check --no-cache
          app/app/auth app/app/core app/app/policy
          app/app/config.py app/app/db.py app/app/aws.py app/app/main.py

      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/nesume -f deploy/nesume/values-kind.yaml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -recursive -check infra
      - name: terraform validate (base, compute)
        run: |
          for d in infra/envs/dev/base infra/envs/dev/compute; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

      # web 빌드는 빠르고 외부 서비스가 필요 없어 lint 에 둔다.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web build
        working-directory: web
        run: |
          npm ci
          npm run build

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # README ".env 로컬 예시" 와 같은 값. 토큰만 Secrets 에서.
      - name: write .env
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          cat > .env <<ENV
          APP_ENV=test
          HOST_BIND_IP=127.0.0.1
          WEB_PORT=8080
          APP_PORT=8000
          LOCALSTACK_PORT=4566
          COGNITO_PORT=9229
          DB_NAME=nesume
          DB_USER=nesume
          DB_PASSWORD=ci-only
          LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
          AWS_REGION=ap-northeast-2
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          S3_BUCKET_NAME=nesume-local-docs
          KMS_KEY_ALIAS=alias/nesume-local-pii
          APP_SECRET_NAME=nesume/local/app
          COGNITO_ISSUER_DOMAIN=http://localhost:9229
          COGNITO_USER_POOL_ID=local_nesume
          COGNITO_CLIENT_ID=nesumelocalclient00000001
          OPERATOR_MFA_REQUIRED=false
          ENV

      - name: start db, localstack, cognito
        run: docker compose up -d db localstack cognito --wait --wait-timeout 300

      - name: build test image
        run: docker compose --profile test build test

      - name: pytest
        run: docker compose run --rm -T test

      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: teardown
        if: always()
        run: docker compose --profile test down -v --remove-orphans

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action 이 PR 커밋 목록을 API 로 읽는다
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # gitleaks 가 PR 커밋 범위를 본다

      - name: LLM direct import check
        run: bash scripts/check_llm_imports.sh

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # main 전용. test 가 paths 필터로 skip 돼도 진행한다(lint·security 는 반드시 success).
  build-deploy:
    if: >-
      github.ref == 'refs/heads/main' && !cancelled()
      && needs.lint.result == 'success' && needs.security.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write   # OIDC 로 nesume-github-ci 역할을 받는다. 저장소에 AWS 키 없음
      contents: read
    concurrency:
      group: infra        # infra.yml(up/down) 과 같은 그룹. 동시에 클러스터를 만지지 않는다
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2.1.7
        id: ecr

      - name: image tag = short sha
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ECR 태그가 IMMUTABLE 이라 같은 sha 재실행은 푸시를 건너뛴다.
      - name: already in ECR?
        id: exists
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          ok=true
          for r in app web; do
            aws ecr describe-images --repository-name "nesume/$r" --image-ids "imageTag=$SHA" >/dev/null 2>&1 || ok=false
          done
          echo "skip=$ok" >> "$GITHUB_OUTPUT"
          echo "images for $SHA already in ECR: $ok"

      - uses: docker/setup-qemu-action@v4.4.0
        if: steps.exists.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.exists.outputs.skip != 'true'

      - name: build & push app (arm64)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./app
          target: runtime
          build-args: APP_VERSION=${{ steps.tag.outputs.sha }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/nesume/app:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: build & push web (arm64)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./web
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/nesume/web:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # 푸시 후 스캔. 걸리면 배포만 막힌다(이미지는 ECR 에 남음).
      - name: trivy image scan (app)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/nesume/app:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # D17: web 도 같은 게이트(11-02 확인 전에는 빌드·푸시만 하고 스캔하지 않았다)
      - name: trivy image scan (web)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/nesume/web:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: cluster up?
        id: cluster
        run: |
          if aws eks describe-cluster --name "$EKS_CLUSTER" --query cluster.status --output text 2>/dev/null | grep -q ACTIVE; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "### dev cluster is down, skip deploy (pushed \`${{ steps.tag.outputs.sha }}\` to ECR)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: azure/setup-helm@v4
        if: steps.cluster.outputs.up == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.cluster.outputs.up == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false   # output 을 변수로 받기 위해

      - name: helm upgrade (dev)
        if: steps.cluster.outputs.up == 'true'
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          terraform -chdir=infra/envs/dev/compute init -input=false >/dev/null
          DB=$(terraform -chdir=infra/envs/dev/compute output -raw rds_address)
          # D20 embedder 는 embedder/ 가 바뀔 때만 빌드돼 app 과 태그가 다르다. ECR 최신 태그를 쓰고, 저장소가 없거나 비면 끈다
          # (up.ps1/deploy.ps1 과 같은 규칙). 없으면 helm 이 image.embedder.tag required 로 실패한다(10-28 실측).
          EMB=$(aws ecr describe-images --repository-name nesume/embedder \
                --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' --output text 2>/dev/null || true)
          if [ -n "$EMB" ] && [ "$EMB" != "None" ]; then
            EMB_SET=(--set-string image.embedder.tag="$EMB"); echo "embedder image: nesume/embedder:$EMB"
          else
            EMB_SET=(--set embedder.enabled=false); echo "::warning::ECR nesume/embedder is empty; deploying with embedder.enabled=false"
          fi
          # --set-string: 숫자만 있는 sha 를 --set 은 int 로 읽어 이미지 이름이 깨진다(10-27 실측)
          helm upgrade --install nesume deploy/nesume -n dev -f deploy/nesume/values-dev.yaml \
            --set-string config.DB_HOST="$DB" \
            --set-string image.app.tag="$SHA" --set-string image.web.tag="$SHA" "${EMB_SET[@]}" \
            --wait --timeout 10m

      - name: health check
        if: steps.cluster.outputs.up == 'true'
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          ALB=$(kubectl -n dev get ingress nesume -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          for i in $(seq 1 18); do
            body=$(curl -fsS --max-time 5 "http://$ALB/api/health" || true)
            if echo "$body" | grep -q "$SHA"; then
              echo "### deployed \`$SHA\` -> http://$ALB" >> "$GITHUB_STEP_SUMMARY"
              echo "$body"; exit 0
            fi
            sleep 10
          done
          echo "/api/health at http://$ALB does not report $SHA"; kubectl -n dev get pods; exit 1
