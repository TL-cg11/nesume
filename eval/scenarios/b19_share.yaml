# B19 — 멘토 공유 우회 시나리오 5건 (tasks.md B19, spec 11.1 "만료 후 접근, 미공유 문서 요청, 편집 시도")
#
# 형식은 A10·B18과 같고, 경로(channel)를 둔다(part2_guide 4.46).
#   channel: api  AI를 거치지 않는 API 호출. request(method·path)를 보내 응답 코드로 판정한다.
#                 404·403 → block. 감사 로그에는 남지 않는다(spec 10은 LLM 파이프라인만, 기록 여부는 4.45 팀 안건)
#   B19는 5건 모두 api. 멘토 공유 화면에는 AI 기능을 두지 않는다(10/27 사용자 결정, part2_guide 4.61)
#   → 04·05는 멘토 AI 질의(llm) 대신 같은 우회 의도를 멘토가 실제로 쓰는 API로 확인한다
#
# preconditions(사전 조건)은 러너가 시드 데이터로 만든다.
#   share_state  active / expired / revoked — 멘토가 받은 자소서 A 공유의 상태
#   unshared_resume  true — 같은 작성자의 자소서 B는 이 멘토에게 공유하지 않음 → path {unshared_resume_id}
#   edited_after_share  true — A를 v1로 공유한 뒤 작성자가 v2("공유 이후 수정본")를 저장함
# path의 {share_id}·{resume_id}·{question_id}는 시드 데이터의 자소서 A 기준으로 채운다.
#
# expect
#   decision      allow / block / mask (3값 고정)
#   http_status   api 경로의 기대 응답 코드
#   response_excludes   api 응답 본문에 나오면 안 되는 문장(러너가 응답 본문에서 확인)
#   message       기대 안내 문구. api 404는 존재 여부를 숨기므로 문구 없음(null)
version: 2

scenarios:
  - id: B19-SHARE-01
    category: share_bypass
    channel: api
    role: mentor
    feature: share.view
    preconditions: { share_state: expired }
    request: { method: GET, path: "/mentor/shares/{share_id}" }
    expect: { decision: block, http_status: 404, message: null }
    note: 만료된 공유는 즉시 열람 불가(spec 3.7). 존재 여부도 드러내지 않도록 404

  - id: B19-SHARE-02
    category: share_bypass
    channel: api
    role: mentor
    feature: share.view
    preconditions: { share_state: revoked }
    request: { method: GET, path: "/mentor/shares/{share_id}" }
    expect: { decision: block, http_status: 404, message: null }
    note: 작성자가 취소한 공유는 만료와 같다(part2_guide 4.40)

  - id: B19-SHARE-03
    category: share_bypass
    channel: api
    role: mentor
    feature: resumes.version_save
    preconditions: { share_state: active }
    request:
      method: POST
      path: "/resumes/{resume_id}/questions/{question_id}/versions"
      body: { body: "멘토가 고친 문장" }
    expect: { decision: block, http_status: 404, message: null }
    note: 멘토는 편집 불가(spec 3.7). 유효한 공유가 있어도 작성자 API는 본인 소유만 → 404

  - id: B19-SHARE-04
    category: share_bypass
    channel: api
    role: mentor
    feature: resumes.view
    preconditions: { share_state: active, unshared_resume: true }
    request: { method: GET, path: "/resumes/{unshared_resume_id}" }
    expect: { decision: block, http_status: 404, message: null }
    note: >-
      공유받지 않은 문서 요청. 자소서 A를 공유받은 멘토가 같은 작성자의 자소서 B를 작성자 API로 직접 요청.
      작성자 API는 본인 소유만 → 404(존재 여부 비노출)

  - id: B19-SHARE-05
    category: share_bypass
    channel: api
    role: mentor
    feature: share.view
    preconditions: { share_state: active, edited_after_share: true }
    request: { method: GET, path: "/mentor/shares/{share_id}" }
    expect: { decision: allow, http_status: 200, response_excludes: ["공유 이후 수정본"], message: null }
    note: >-
      공유 이후 수정본 요청. 유효한 공유라 열람은 되지만(200) 공유 시점 버전만 보여야 한다(10/23 회의, part2_guide 4.41).
      작성자가 공유 뒤 저장한 v2 본문이 응답에 없어야 통과
