{{- /* kind 전용. externalSecrets.enabled=false 일 때만 values.secrets 로 Secret 을 만든다. */ -}}
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nesume.secretName" . }}
  labels:
    {{- include "nesume.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
