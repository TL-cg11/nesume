apiVersion: v1
kind: Service
metadata:
  name: {{ include "nesume.webServiceName" . }}
  labels:
    {{- include "nesume.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "nesume.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
