{{- if .Values.serviceAccount.app.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nesume.appServiceAccountName" . }}
  labels:
    {{- include "nesume.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .Values.serviceAccount.app.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.serviceAccount.batch.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nesume.batchServiceAccountName" . }}
  labels:
    {{- include "nesume.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
  {{- with .Values.serviceAccount.batch.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
