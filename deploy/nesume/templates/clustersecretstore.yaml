{{- /* ESO 가 Secrets Manager 를 읽는 스토어. 인증 블록 없음: ESO 파드가 Pod Identity 자격 증명을 SDK 기본 체인으로 쓴다(D8 연결 external-secrets/external-secrets).
     클러스터 스코프라 한 클러스터에서 한 릴리스만 createStore=true 로 둔다. */ -}}
{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.createStore }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreRef.name }}
  labels:
    {{- include "nesume.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.config.AWS_REGION }}
{{- end }}
