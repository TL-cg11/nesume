apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nesume.fullname" . }}-web
  labels:
    {{- include "nesume.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "nesume.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nesume.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                 # nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "nesume.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx.conf.template 의 ${APP_UPSTREAM}. app Service 이름:포트 와 일치해야 한다.
            - name: APP_UPSTREAM
              value: {{ include "nesume.appServiceName" . }}:8000
            # D7: 기동 스크립트가 /config.json 으로 치환. 풀·클라이언트 ID 는 app 과 같은 ConfigMap 값을 쓴다.
            - name: COGNITO_USER_POOL_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nesume.configMapName" . }}
                  key: COGNITO_USER_POOL_ID
            - name: COGNITO_WEB_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "nesume.configMapName" . }}
                  key: COGNITO_WEB_CLIENT_ID
            - name: COGNITO_ENDPOINT
              value: {{ .Values.web.auth.cognitoEndpoint | quote }}
            - name: AUTH_FLOW
              value: {{ .Values.web.auth.flow | quote }}
            - name: COGNITO_CONNECT_SRC
              value: {{ .Values.web.auth.connectSrc | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          securityContext:
            {{- include "nesume.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # 기동 시 템플릿 치환 결과가 /etc/nginx/conf.d 에 쓰인다. 없으면 Read-only file system 으로 실패
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
