{{- /*
C12 카나리(미끼) 문서 시드. `python -m app.batch.seed_canaries` — 개인 검색 인덱스에 기밀 등급 미끼 3건을 넣는다.
  - 멱등: 이미 있으면 아무것도 안 하고 빠진 미끼만 채운다. 배포마다 post-install/post-upgrade 훅으로 돈다.
  - 임베더 필요: 미끼를 실제 bge-m3 로 임베딩하므로 EMBEDDING_URL 이 있어야 한다(없으면 배치가 종료코드 1).
    그래서 embeddingUrl 이 비면(embedder.enabled=false + config.EMBEDDING_URL 없음, 예: kind·ECR 비었을 때) 아예 만들지 않는다.
  - 순서: D6 seed(weight 5) 뒤(weight 10). CI/up 은 --wait 로 배포하므로 훅이 돌 때 embedder 파드는 Ready 다.
    그래도 TEI 워밍업·첫 설치의 migrate 를 기다리도록 backoffLimit 만큼 재시도한다(10s·20s·40s·80s).
  - DB 쓰기: users 에 system:canary 1행, user_profile_embeddings 에 3행. 토큰은 DB 에만 두고 로그에 찍지 않는다.
*/ -}}
{{- $cs := .Values.canarySeed }}
{{- if and $cs.enabled (include "nesume.embeddingUrl" . | trim) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nesume.fullname" . }}-canary-seed
  labels:
    {{- include "nesume.labels" . | nindent 4 }}
    app.kubernetes.io/component: canary-seed
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $cs.backoffLimit }}
  ttlSecondsAfterFinished: {{ $cs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "nesume.selectorLabels" (dict "root" . "component" "canary-seed") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "nesume.appServiceAccountName" . }}
      securityContext:
        {{- include "nesume.appPodSecurityContext" . | nindent 8 }}
      containers:
        - name: canary-seed
          image: {{ include "nesume.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml $cs.command | nindent 12 }}
          # ConfigMap(DB_*, EMBEDDING_URL) + Secret(DB_PASSWORD). 앱과 같은 설정으로 같은 DB·임베더를 쓴다.
          envFrom:
            {{- include "nesume.envFrom" . | nindent 12 }}
          securityContext:
            {{- include "nesume.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $cs.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
