{{- /* D17 자리. 규칙은 D17 에서 작성한다. 기본 off. */ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nesume.fullname" . }}-app
  labels:
    {{- include "nesume.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  podSelector:
    matchLabels:
      {{- include "nesume.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nesume.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
      ports:
        - port: 8000
{{- end }}
