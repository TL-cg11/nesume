# production (EKS). 비밀값은 전부 Secrets Manager(ExternalSecret). 이 파일에 평문 비밀을 적지 않는다.
image:
  registry: ""

app:
  replicas: 2

web:
  replicas: 2

config:
  APP_ENV: production
  LOG_LEVEL: INFO
  DB_HOST: ""
  S3_BUCKET_NAME: ""
  KMS_KEY_ALIAS: ""
  APP_SECRET_NAME: ""
  COGNITO_USER_POOL_ID: ""
  COGNITO_CLIENT_ID: ""
  COGNITO_ISSUER: ""
  COGNITO_JWKS_URL: ""

externalSecrets:
  enabled: true
  remoteKey: nesume/production/app

ingress:
  enabled: true
  host: ""
  certificateArn: ""

serviceAccount:
  app:
    annotations: {}
  batch:
    annotations: {}

hpa:
  enabled: true
  min: 2
  max: 6
  cpu: 70

pdb:
  enabled: true
  minAvailable: 1
