# nesume Helm chart 기본 values.
# 기본값은 운영(production) 기준이다. 환경별 차이는 values-<env>.yaml 로 덮어쓴다.
# 환경변수 키 이름은 app/app/config.py 의 Settings 필드와 1:1로 맞춘다.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ""                       # 예: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com. kind는 ""
  app:
    repository: nesume/app
    tag: ""                          # 필수. git sha(D4 태그 규칙). kind는 "local"
  web:
    repository: nesume/web
    tag: ""
  embedder:                          # D20. embedder/ 를 바꾼 커밋의 sha. 매 커밋 빌드하지 않으므로 app·web 과 태그가 다르다
    repository: nesume/embedder
    tag: ""
  pullPolicy: IfNotPresent           # kind: Never

app:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  readinessPath: /ready              # DB+vector+S3 확인. kind는 /health (S3 없음)
  livenessPath: /health
  startupPath: /health
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5           # 엔드포인트 제거가 퍼질 시간. grace 30초 안에 포함된다

web:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  # D7: 기동 시 /config.json 으로 치환되는 브라우저용 Cognito 설정. 풀·웹 클라이언트 ID는 config.* 에서 가져온다.
  auth:
    flow: USER_SRP_AUTH                # 로컬(cognito-local)만 USER_PASSWORD_AUTH
    cognitoEndpoint: ""                # AWS 는 비움(기본 엔드포인트). 로컬은 브라우저가 접근하는 cognito-local 주소
    connectSrc: https://cognito-idp.ap-northeast-2.amazonaws.com   # CSP connect-src

# ConfigMap으로 가는 비밀 아닌 설정. 값은 전부 문자열.
config:
  APP_ENV: production                # local|test|dev|staging|production 만 허용
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  AWS_REGION: ap-northeast-2
  S3_BUCKET_NAME: ""
  KMS_KEY_ALIAS: ""
  APP_SECRET_NAME: ""
  COGNITO_USER_POOL_ID: ""
  COGNITO_CLIENT_ID: ""              # 하위 호환. 비면 COGNITO_CLIENT_IDS 만 본다
  COGNITO_CLIENT_IDS: ""             # D7: "web,runner" 두 클라이언트 ID(쉼표). Terraform output client_ids
  COGNITO_WEB_CLIENT_ID: ""          # D7: web 이 /config.json 으로 받는 웹 클라이언트 ID
  COGNITO_ISSUER: ""
  COGNITO_JWKS_URL: ""
  OPERATOR_MFA_REQUIRED: "true"      # D7: 운영자 보호 API 에 TOTP 등록 + 최근 로그인 요구
  MFA_SESSION_MINUTES: "15"
  MFA_EXEMPT_TEST_OPERATORS: "false" # test 그룹 운영자(test-operator1) MFA 면제. dev·staging 만 true, production 은 앱이 무시
  # A2 LLM. 자격증명은 IRSA(app 역할의 bedrock:InvokeModel). 모델 교체는 LLM_MODEL_ID 한 줄
  LLM_PROVIDER: bedrock
  LLM_MODEL_ID: global.amazon.nova-2-lite-v1:0   # Anthropic 게이트가 열리면 global.anthropic.claude-haiku-5-5
  BEDROCK_REGION: ap-northeast-2
  # D19 출력 레일(Llama Guard 계열 안전 분류 모델, A5 뒤). 기본 꺼짐. 켜면 IRSA app 역할의 output_rail 권한(iam 모듈)이 필요
  LLAMA_GUARD_ENABLED: "false"
  LLAMA_GUARD_MODEL_ID: us.meta.llama3-1-8b-instruct-v1:0   # 계정에 Llama Guard 가 없어 Llama 3.1 8B + Llama Guard 3 템플릿
  LLAMA_GUARD_REGION: us-east-1                              # 서울에는 meta 모델이 없다
  LLAMA_GUARD_TIMEOUT_S: "3"
  LLAMA_GUARD_SAMPLE_RATE: "1.0"                             # 비용 조정. 0.2 면 20% 만 검사
  LLAMA_GUARD_FAIL_OPEN: "true"                              # 모델 오류 시 통과+표식(block-policy 2장 #15)
  # D16 알림. 비우면 로그만. 값은 compute 출력 alerts_topic_arn. Slack 웹훅은 Secrets Manager JSON 의 ALERTS_SLACK_WEBHOOK_URL
  ALERTS_SNS_TOPIC_ARN: ""
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: nesume
  DB_USER: nesume
  EMBEDDING_MODEL: bge-m3            # D20/C3. 차원 1024 와 짝(app/app/models/embedding.py MODEL_VERSION)
  EMBEDDING_URL: ""                  # 비우면 차트 안의 embedder Service(http://<release>-embedder:8080). 외부 서빙이면 여기에
  # C4·C14 공공 API 주소. 키(WORK24_*_API_KEY, SEOUL_OPENAPI_KEY, KMOOC_API_KEY)는 externalSecrets.remoteKey JSON 에 넣는다
  WORK24_API_BASE_URL: https://www.work24.go.kr
  SEOUL_OPENAPI_BASE_URL: http://openapi.seoul.go.kr:8088   # 서울시는 8088 http 만 응답(https 핸드셰이크 실패, 10-29 확인)

# 비밀값. externalSecrets.enabled=true 면 Secrets Manager에서 가져오고 이 맵은 무시된다.
# false(kind)일 때만 secret.yaml 이 이 값으로 Secret을 만든다. 운영 values에 값을 적지 않는다.
secrets:
  DB_PASSWORD: ""
  BATCH_USERNAME: ""                 # D6 시스템 계정(배치용)
  BATCH_PASSWORD: ""
  SEED_PASSWORD: ""               # D6 시드 계정 공통 비밀번호(seed.enabled 환경만)
  ALERTS_SLACK_WEBHOOK_URL: ""    # D16 로컬·kind 전용(SNS 없이 직접 POST). AWS 는 Secrets Manager JSON 필드

externalSecrets:
  enabled: true
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  createStore: false                 # true: 차트가 ClusterSecretStore 를 만든다(clustersecretstore.yaml). 클러스터 스코프라 클러스터당 한 릴리스만 true
  remoteKey: nesume/production/app   # Secrets Manager 키. JSON 필드명 = secrets.* 키
  refreshInterval: 1h

migrate:
  enabled: true
  hook: true                         # true: pre-install/pre-upgrade hook. false(kind): 일반 Job + wait-for-db
  backoffLimit: 1
  ttlSecondsAfterFinished: 600

cronjobs:
  jobsCollector:                     # C4 공고 수집
    enabled: false
    schedule: "0 18 * * *"           # UTC. 한국 03:00
    command: ["python", "-m", "app.batch.jobs_collector"]
    suspend: false
  purge:                             # B20 삭제 배치
    enabled: false
    schedule: "30 18 * * *"
    command: ["python", "-m", "app.batch.purge"]
    suspend: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# D20 bge-m3 임베딩 서비스(embedder/Dockerfile, TEI). C3 파이프라인·C8 추천이 EMBEDDING_URL 로 호출한다.
# fp32 ONNX CPU 서빙. 10-28 로컬 실측(arm64, MAX_BATCH_TOKENS=2048): 기동 65s, RSS 정상 4.4GB·피크 4.45GB.
# 전용 노드그룹(infra eks: aws_eks_node_group.embedding, m7g.large 할당 가능 7.2GB, taint nesume.io/workload=embedding)에 올린다.
embedder:
  enabled: true
  replicas: 1                        # 노드 1대. 늘리려면 노드그룹 desired 도 같이
  containerPort: 8080
  service:
    port: 8080
  resources:
    requests: { cpu: "1", memory: 4608Mi }
    limits: { cpu: "2", memory: 6144Mi }   # 피크 4.45GB + 여유. 노드 1대를 전용으로 쓰므로 넉넉히
  startupFailureThreshold: 60        # 5s x 60 = 5분. 로컬 65s. 이보다 길면 노드가 너무 작다
  env:                               # TEI 설정. 이미지 ENV 기본값을 덮는다
    MAX_CLIENT_BATCH_SIZE: "32"
    MAX_BATCH_TOKENS: "2048"         # 올리면 메모리 급증(8192 는 OOM). 입력은 이 길이에서 잘린다
    MAX_CONCURRENT_REQUESTS: "64"
  nodeSelector:
    nesume.io/workload: embedding
  tolerations:
    - key: nesume.io/workload
      operator: Equal
      value: embedding
      effect: NoSchedule

seed:                                # D6. staging 만 true
  enabled: false
  command: ["python", "-m", "app.auth.seed"]

# C12 카나리(미끼) 문서 시드. post-install/post-upgrade 훅 Job(canary-seed-job.yaml). 멱등이라 배포마다 돌아도 된다.
# 임베더가 있어야 하므로 EMBEDDING_URL 이 비는 환경(kind, embedder.enabled=false)에서는 만들지 않는다.
canarySeed:
  enabled: true
  command: ["python", "-m", "app.batch.seed_canaries"]
  backoffLimit: 4                    # embedder 워밍업·첫 설치 migrate 대기. 10s·20s·40s·80s 재시도
  ttlSecondsAfterFinished: 600
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: alb
  host: ""
  certificateArn: ""
  annotations: {}

serviceAccount:
  app:
    create: true
    annotations: {}                  # IRSA: eks.amazonaws.com/role-arn 은 values-<env> 에서
  batch:
    create: true
    annotations: {}

hpa:
  enabled: true
  min: 2
  max: 6
  cpu: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:                       # D17. 규칙은 그때 작성
  enabled: false

postgres:                            # kind 전용 내장 DB
  enabled: false
  image: pgvector/pgvector:0.8.7-pg16-bookworm
  waitImage: busybox:1.37
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
