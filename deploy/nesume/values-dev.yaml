# dev (EKS). 값은 D8·D9 에서 채운다.
image:
  registry: 852138520969.dkr.ecr.ap-northeast-2.amazonaws.com
  pullPolicy: IfNotPresent

app:
  replicas: 2                        # 스팟 회수·롤링 중 무중단. pdb minAvailable 1 과 짝

web:
  replicas: 1

config:
  APP_ENV: dev
  LOG_LEVEL: INFO                    # DEBUG 는 botocore 가 임시 자격 증명·서명 헤더를 로그에 찍는다(10-27 확인)
  DB_HOST: ""                        # 매일 바뀐다. up.ps1 이 --set config.DB_HOST 로 넘긴다
  # 아래는 base 레이어 output (terraform -chdir=infra/envs/dev/base output). base 를 다시 만들지 않는 한 고정.
  S3_BUCKET_NAME: nesume-dev-docs-852138520969
  KMS_KEY_ALIAS: alias/nesume-dev-pii
  APP_SECRET_NAME: nesume/dev/app
  COGNITO_USER_POOL_ID: ap-northeast-2_jFqNdpDUg
  COGNITO_CLIENT_ID: ""
  COGNITO_CLIENT_IDS: "ldgp7rgsjbhnoiha00gt250lv,5e8g76caq7v0r5nt3pb86muv3i"   # web,runner (cognito_client_ids)
  COGNITO_WEB_CLIENT_ID: ldgp7rgsjbhnoiha00gt250lv
  COGNITO_ISSUER: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_jFqNdpDUg
  COGNITO_JWKS_URL: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_jFqNdpDUg/.well-known/jwks.json

externalSecrets:
  enabled: true
  remoteKey: nesume/dev/app
  createStore: true                  # dev 클러스터의 유일한 릴리스. 스토어 region 은 config.AWS_REGION

ingress:
  enabled: true
  host: ""                           # dev.<domain>
  certificateArn: ""

serviceAccount:
  app:
    annotations: {}                  # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/nesume-dev-app
  batch:
    annotations: {}                  # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/nesume-dev-batch

hpa:
  enabled: false

pdb:
  enabled: true                      # minAvailable 1(기본값). replicas 1 로 내리면 drain 이 막히니 같이 끈다
