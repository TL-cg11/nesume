# dev (EKS). 값은 D8·D9 에서 채운다.
image:
  registry: 852138520969.dkr.ecr.ap-northeast-2.amazonaws.com
  pullPolicy: IfNotPresent

app:
  replicas: 2                        # 스팟 회수·롤링 중 무중단. pdb minAvailable 1 과 짝

web:
  replicas: 1

config:
  APP_ENV: dev
  MFA_EXEMPT_TEST_OPERATORS: "true" # 시드 test-operator1 은 TOTP 없이 역할 관리 등 운영자 기능 사용(D7)
  LOG_LEVEL: INFO                    # DEBUG 는 botocore 가 임시 자격 증명·서명 헤더를 로그에 찍는다(10-27 확인)
  DB_HOST: ""                        # 매일 바뀐다. up.ps1 이 --set config.DB_HOST 로 넘긴다
  # 아래는 base 레이어 output (terraform -chdir=infra/envs/dev/base output). base 를 다시 만들지 않는 한 고정.
  S3_BUCKET_NAME: nesume-dev-docs-852138520969
  KMS_KEY_ALIAS: alias/nesume-dev-pii
  APP_SECRET_NAME: nesume/dev/app
  COGNITO_USER_POOL_ID: ap-northeast-2_jFqNdpDUg
  COGNITO_CLIENT_ID: ""
  COGNITO_CLIENT_IDS: "ldgp7rgsjbhnoiha00gt250lv,5e8g76caq7v0r5nt3pb86muv3i"   # web,runner (cognito_client_ids)
  COGNITO_WEB_CLIENT_ID: ldgp7rgsjbhnoiha00gt250lv
  COGNITO_ISSUER: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_jFqNdpDUg
  COGNITO_JWKS_URL: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_jFqNdpDUg/.well-known/jwks.json
  # D16: compute 출력 alerts_topic_arn(토픽 이름 고정). D19: dev 는 레일 켬(끄려면 "false" 한 줄)
  ALERTS_SNS_TOPIC_ARN: arn:aws:sns:ap-northeast-2:852138520969:nesume-dev-alerts
  LLAMA_GUARD_ENABLED: "true"
  # 11-03: 대역 모델(Llama 3.1 8B)이 보안 직무 자소서 문장을 unsafe 로 찍어 5건 오차단 → 기록 전용(판정·표식·로그는 남고
  # 응답은 통과). 정식 Llama Guard 로 바꾸거나 B16 러너로 과차단율을 확인한 뒤 "true" 로. docs/ops/output-rail.md 5장
  LLAMA_GUARD_ENFORCE: "false"
  # C16: 질의·검색 조각 모두 관찰(shadow — 판정·지연 그대로, 로그만). 끄려면 "off"
  NEMO_QUERY_MODE: "shadow"
  NEMO_CHUNK_MODE: "shadow"

externalSecrets:
  enabled: true
  remoteKey: nesume/dev/app
  createStore: true                  # dev 클러스터의 유일한 릴리스. 스토어 region 은 config.AWS_REGION

ingress:
  enabled: true
  host: ""                           # dev.<domain>
  certificateArn: ""
  annotations:
    # D17 WAF(base output waf_web_acl_arn). Count/Block 은 infra/modules/waf mode 로 바꾼다(주석 그대로)
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-northeast-2:852138520969:regional/webacl/nesume-dev-alb/b48bda0a-6917-4a19-9d2c-6642227822c8

serviceAccount:
  app:
    annotations: {}                  # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/nesume-dev-app
  batch:
    annotations: {}                  # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/nesume-dev-batch

hpa:
  enabled: false

cronjobs:
  jobsCollector:
    enabled: true                    # C4·C14 수집 + 임베딩 색인. API 키는 Secrets Manager nesume/dev/app
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }   # 서울시 전량(~4만 건)을 메모리에 모은다

embedder:
  enabled: true                      # up.ps1/deploy.ps1 이 ECR nesume/embedder 최신 태그를 --set-string image.embedder.tag 로 넘긴다. 저장소가 비면 false 로 배포

networkPolicy:
  enabled: true                      # D17. CIDR 은 values.yaml 기본값(= infra/modules/network 기본값)

pdb:
  enabled: true                      # minAvailable 1(기본값). replicas 1 로 내리면 drain 이 막히니 같이 끈다
